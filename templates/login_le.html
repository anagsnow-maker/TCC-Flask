<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="pagina_login m-0 p-0 vh-100 overflow-hidden">
    <div class="barra-topo fixed-top w-100 bg-white border-bottom border-warning border-4 py-2 px-4">
        <img src="{{ url_for('static', filename='loge.png') }}" alt="Logo Topo" style="width: 250px; height: auto; margin-left: 45px;">
    </div>

    <div class="container-fluid h-100 w-100 d-flex flex-column align-items-center justify-content-center">
        
        <main class="w-100 d-flex justify-content-center align-items-center" style="max-width: 330px; padding: 15px;">
            <form action="/" method="POST" class="caixa-login bg-white p-5 rounded-4 shadow text-center">
               <img src="{{ url_for('static', filename='senai.png') }}" alt="Logo SENAI" style="width: 100%; max-width: 280px; height: auto; display: block; margin: 0 auto 20px auto">
                
                <h1 class="h3 mb-3 fw-normal">Seja bem-vindo</h1> 

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" name="username" placeholder="Digite seu usuário" required>
                    <label for="floatingInput">Usuário</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Senha" required>
                    <label for="floatingPassword">Senha</label>
                </div>

                <button class="btn btn-primary w-100 py-2" type="submit">Entrar</button>
            </form>
        </main>
    </div>
</body>
</html>
