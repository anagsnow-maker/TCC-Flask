<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SENAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="barra-topo"> 
        <img src="{{ url_for('static', filename='loge.png') }}" alt="Logo Topo" style="width: 250px; height: auto;">
    </div>

    <div class="main-wrapper">
        <div class="container-formulario">
            
            <div class="form-header">
                <div class="subtitle">
                    <img src="{{ url_for('static', filename='senai.png') }}" alt="SENAI" width="100%">
                </div>
            </div>
            
            <h3 style="color: #002A54; text-align: center; font-weight: 700; font-size: 18px; margin-bottom: 25px; text-transform: uppercase;">
                Login de Usuário
            </h3>

            <form action="/login" method="POST">
                
                <div class="form-group">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="username" placeholder="Digite seu usuário" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="password" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-enviar">ENTRAR</button>
            </form>

        </div>
    </div>

</body>
</html>
